name: License check

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  license-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4.1.6
      with:
        fetch-depth: 0

    - name: Check for non-GPL code
      run: bash scripts/check-license.sh HEAD